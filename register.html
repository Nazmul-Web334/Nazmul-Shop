<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Create Account - Nazmul Shop</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- ================= REGISTER PAGE ================= -->

    <main class="login-page">

        <div class="login-container">


            <!-- Logo -->

            <div class="login-logo">

                <a href="index.html">
                    Nazmul Shop
                </a>

            </div>


            <h1>
                Create Account
            </h1>


            <p class="login-subtitle">
                নতুন Account তৈরি করুন
            </p>



            <!-- Registration Form -->

            <form id="registerForm">


                <!-- Name -->

                <div class="form-group">

                    <label for="registerName">
                        আপনার নাম
                    </label>

                    <input
                        type="text"
                        id="registerName"
                        placeholder="আপনার নাম লিখুন"
                        required
                    >

                </div>



                <!-- Mobile -->

                <div class="form-group">

                    <label for="registerMobile">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="registerMobile"
                        placeholder="01XXXXXXXXX"
                        maxlength="11"
                        inputmode="numeric"
                        required
                    >

                </div>



                <!-- Password -->

                <div class="form-group">

                    <label for="registerPassword">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="registerPassword"
                            placeholder="কমপক্ষে ৬ অক্ষর"
                            required
                        >

                        <button
                            type="button"
                            id="showRegisterPassword">

                            👁️

                        </button>

                    </div>

                </div>



                <!-- Confirm Password -->

                <div class="form-group">

                    <label for="confirmPassword">
                        Confirm Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="confirmPassword"
                            placeholder="Password আবার লিখুন"
                            required
                        >

                        <button
                            type="button"
                            id="showConfirmPassword">

                            👁️

                        </button>

                    </div>

                </div>



                <!-- Terms -->

                <div class="remember-row">

                    <label>

                        <input
                            type="checkbox"
                            id="agreeTerms"
                            required
                        >

                        আমি Terms মেনে নিচ্ছি

                    </label>

                </div>



                <!-- Register Button -->

                <button
                    type="submit"
                    class="login-btn">

                    Create Account

                </button>


            </form>



            <!-- Login -->

            <div class="register-section">

                <p>
                    আগে থেকেই Account আছে?
                </p>

                <a href="login.html">
                    Login করুন
                </a>

            </div>



            <!-- Home -->

            <a
                href="index.html"
                class="back-home">

                ← Back to Home

            </a>

        </div>

    </main>



    <!-- JavaScript -->

    <script src="register.js"></script>

</body>

</html>
