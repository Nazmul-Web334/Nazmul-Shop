<!DOCTYPE html>
<html lang="bn">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Nazmul Shop</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- ================= LOGIN PAGE ================= -->

    <main class="login-page">

        <div class="login-container">


            <!-- Logo -->

            <div class="login-logo">

                <a href="index.html">
                    Nazmul Shop
                </a>

            </div>


            <h1>
                Login
            </h1>

            <p class="login-subtitle">
                আপনার মোবাইল নম্বর দিয়ে Login করুন
            </p>



            <!-- Login Form -->

            <form id="loginForm">


                <!-- Mobile Number -->

                <div class="form-group">

                    <label for="loginMobile">
                        Mobile Number
                    </label>

                    <input
                        type="tel"
                        id="loginMobile"
                        placeholder="01XXXXXXXXX"
                        maxlength="11"
                        inputmode="numeric"
                        required
                    >

                </div>



                <!-- Password -->

                <div class="form-group">

                    <label for="loginPassword">
                        Password
                    </label>

                    <div class="password-box">

                        <input
                            type="password"
                            id="loginPassword"
                            placeholder="Enter your password"
                            required
                        >

                        <button
                            type="button"
                            id="showPassword">

                            👁️

                        </button>

                    </div>

                </div>



                <!-- Remember Me -->

                <div class="remember-row">

                    <label>

                        <input
                            type="checkbox"
                            id="rememberMe"
                        >

                        Remember Me

                    </label>


                    <a href="#">
                        Forgot Password?
                    </a>

                </div>



                <!-- Login Button -->

                <button
                    type="submit"
                    class="login-btn">

                    Login

                </button>


            </form>



            <!-- Registration -->

            <div class="register-section">

                <p>
                    আপনার Account নেই?
                </p>

                <a href="register.html">
                    Create New Account
                </a>

            </div>



            <!-- Back Home -->

            <a
                href="index.html"
                class="back-home">

                ← Back to Home

            </a>

        </div>

    </main>


    <!-- JavaScript -->

    <script src="login.js"></script>

</body>

</html>
